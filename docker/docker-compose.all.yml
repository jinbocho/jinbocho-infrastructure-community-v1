# Full stack — every service (incl. frontend) on a single server (any VPS).
# Backend services pull pre-built images from GHCR; the frontend is built from
# source (../jinbocho-fe) because no published frontend image exists yet.
# A Caddy reverse proxy in front terminates TLS (automatic Let's Encrypt when
# DOMAIN is a real hostname) and is the only container exposed to the host.
#
# Generated/managed by scripts/setup-vps-community.sh — see that script for
# the one-shot install flow. Manual usage:
#
#   docker compose -f docker-compose.all.yml --env-file .env up -d --build
#
# `name:` is pinned so the Compose project identity stays stable across
# re-runs from a different checkout path/directory name — otherwise Compose
# picks a new project name but tries to recreate the same fixed
# `container_name`s, which Docker refuses (name already in use by the old
# project's containers).
name: jinbocho

services:
  # ADR-018: one physical database ("jinbocho") shared by auth/catalog/ai,
  # each isolated in its own Postgres SCHEMA + least-privilege ROLE (see
  # ../init-sql/00-schemas-and-roles.sh). Replaces the former postgres-auth +
  # postgres-catalog (+ postgres-ai, added by the Pro overlay) containers.
  # Does NOT give cross-service transactions — see ADR-018 Context. NOTE:
  # this file is dev/local scope per ADR-018 §4 — do not point this at a
  # production VPS without the (not-yet-written) data migration runbook.
  postgres:
    image: postgres:16-alpine
    container_name: jinbocho-postgres
    environment:
      POSTGRES_DB: jinbocho
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jinbocho-network

  auth-service:
    image: ghcr.io/jinbocho/jinbocho-auth-v1:${JINBOCHO_VERSION:-latest}
    container_name: jinbocho-auth
    env_file:
      - ../envs/auth-service.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jinbocho-network

  catalog-service:
    image: ghcr.io/jinbocho/jinbocho-catalog-v1:${JINBOCHO_VERSION:-latest}
    container_name: jinbocho-catalog
    env_file:
      - ../envs/catalog-service.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jinbocho-network

  api-gateway:
    image: ghcr.io/jinbocho/jinbocho-api-gateway-v1:${JINBOCHO_VERSION:-latest}
    container_name: jinbocho-api-gateway
    env_file:
      - ../envs/api-gateway.env
    depends_on:
      - auth-service
      - catalog-service
    restart: unless-stopped
    networks:
      - jinbocho-network
    # No host port published — only reachable through the Caddy reverse proxy.

  frontend:
    build:
      context: ../../jinbocho-fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: jinbocho-frontend
    restart: unless-stopped
    networks:
      - jinbocho-network
    # No host port published — only reachable through the Caddy reverse proxy.

  caddy:
    image: caddy:2-alpine
    container_name: jinbocho-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api-gateway
    networks:
      - jinbocho-network

  # Observability — replaces the Grafana Alloy/node-exporter/cadvisor/
  # postgres-exporter stack (ADR-012) with a single container. Host +
  # per-container metrics via /proc, /sys and the Docker socket; built-in
  # dashboard on :19999, bound to localhost only — reach it with
  # `ssh -L 19999:localhost:19999 <host>` then http://localhost:19999.
  # Off by default; enable with:
  #   docker compose -f docker-compose.all.yml --profile observability --env-file .env up -d
  netdata:
    image: netdata/netdata:stable
    container_name: jinbocho-netdata
    hostname: jinbocho
    pid: host
    profiles:
      - observability
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "127.0.0.1:19999:19999"
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      # Same trust level the old Alloy setup already had — container
      # discovery/stats need it, no way around it for per-container metrics.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - jinbocho-network

networks:
  jinbocho-network:
    driver: bridge

volumes:
  postgres_data:
    name: jinbocho_postgres_data
  caddy_data:
    name: jinbocho_caddy_data
  caddy_config:
    name: jinbocho_caddy_config
  netdataconfig:
    name: jinbocho_netdataconfig
  netdatalib:
    name: jinbocho_netdatalib
  netdatacache:
    name: jinbocho_netdatacache
