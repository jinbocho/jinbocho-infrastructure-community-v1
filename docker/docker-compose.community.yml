# Community edition — pulls pre-built backend images from GHCR (no source
# checkout, no --build). AI module not included — see docker-compose.pro.yml
# (commercial) for that.
#
#   docker compose -f docker-compose.community.yml up -d
#
# To build from local source checkouts instead, use
# docker-compose.community.local.yml.
#
# `name:` and the volume `name:` overrides below are pinned so Postgres data
# survives regardless of project-directory path/name, and is shared with
# docker-compose.all.yml / docker-compose.pro.yml if you switch deployment
# topology on the same host — Compose-managed volume names are otherwise
# derived from the project name, which silently changes data volumes if the
# checkout path or invocation context ever changes.
name: jinbocho

services:
  # ADR-018: one physical database ("jinbocho") shared by auth/catalog/ai,
  # each isolated in its own Postgres SCHEMA + least-privilege ROLE (see
  # ../init-sql/00-schemas-and-roles.sh). Replaces the former postgres-auth +
  # postgres-catalog (+ postgres-ai, added by the Pro overlay) containers.
  # Does NOT give cross-service transactions — see ADR-018 Context.
  postgres:
    image: postgres:16-alpine
    container_name: jinbocho-postgres
    environment:
      POSTGRES_DB: jinbocho
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jinbocho-network

  auth-service:
    image: ghcr.io/jinbocho/jinbocho-auth-v1:${AUTH_SERVICE_VERSION:-latest}
    container_name: jinbocho-auth
    env_file:
      - ../envs/auth-service.env   # copy from auth-service.env.example and fill in values
    ports:
      # localhost-only: internal service, public access goes via the gateway (:8000)
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jinbocho-network

  catalog-service:
    image: ghcr.io/jinbocho/jinbocho-catalog-v1:${CATALOG_SERVICE_VERSION:-latest}
    container_name: jinbocho-catalog
    env_file:
      - ../envs/catalog-service.env   # copy from catalog-service.env.example and fill in values
    ports:
      # localhost-only: internal service, public access goes via the gateway (:8000)
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jinbocho-network

  api-gateway:
    image: ghcr.io/jinbocho/jinbocho-api-gateway-v1:${API_GATEWAY_VERSION:-latest}
    container_name: jinbocho-api-gateway
    env_file:
      - ../envs/api-gateway.env   # copy from api-gateway.env.example and fill in values
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - catalog-service
    networks:
      - jinbocho-network

  # Observability — replaces the Grafana Alloy/node-exporter/cadvisor/
  # postgres-exporter stack (ADR-012) with a single container. Host +
  # per-container metrics via /proc, /sys and the Docker socket; built-in
  # dashboard on :19999, bound to localhost only — reach it with
  # `ssh -L 19999:localhost:19999 <host>` then http://localhost:19999.
  # Off by default; enable with:
  #   docker compose -f docker-compose.community.yml --profile observability up -d
  netdata:
    image: netdata/netdata:stable
    container_name: jinbocho-netdata
    hostname: jinbocho
    pid: host
    profiles:
      - observability
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "127.0.0.1:19999:19999"
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      # Same trust level the old Alloy setup already had — container
      # discovery/stats need it, no way around it for per-container metrics.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jinbocho-network

networks:
  jinbocho-network:
    driver: bridge

volumes:
  postgres_data:
    name: jinbocho_postgres_data
  netdataconfig:
    name: jinbocho_netdataconfig
  netdatalib:
    name: jinbocho_netdatalib
  netdatacache:
    name: jinbocho_netdatacache
