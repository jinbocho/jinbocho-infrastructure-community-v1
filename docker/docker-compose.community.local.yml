# Community edition — build backend services from local source checkouts in
# this workspace (../jinbocho-auth-v1, ../jinbocho-catalog-v1,
# ../jinbocho-api-gateway-v1). AI module not included — see
# docker-compose.pro.local.yml for that. For contributors working on
# service code; no GHCR pull, always rebuilds.
#
#   docker compose -f docker-compose.community.local.yml up --build -d
#
# For a pre-built, no-checkout install use docker-compose.community.yml instead.
#
# `name:` and the volume `name:` overrides below are pinned so dev Postgres
# data survives regardless of project-directory path/name — Compose-managed
# volume names are otherwise derived from the project name, which silently
# changes data volumes if the checkout path or invocation context changes.
name: jinbocho-local

services:
  # ADR-018: one physical database ("jinbocho") shared by auth/catalog/ai,
  # each isolated in its own Postgres SCHEMA + least-privilege ROLE (see
  # ../init-sql/00-schemas-and-roles.sh). Replaces the former postgres-auth +
  # postgres-catalog (+ postgres-ai, added by the Pro overlay) containers.
  # Does NOT give cross-service transactions — see ADR-018 Context.
  postgres:
    image: postgres:16-alpine
    container_name: jinbocho-postgres
    environment:
      POSTGRES_DB: jinbocho
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jinbocho-network

  auth-service:
    build:
      context: ../../jinbocho-auth-v1
    container_name: jinbocho-auth
    env_file:
      - ../envs/auth-service.env   # copy from auth-service.env.example and fill in values
    ports:
      # localhost-only: internal service, public access goes via the gateway (:8000)
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jinbocho-network

  catalog-service:
    build:
      context: ../../jinbocho-catalog-v1
    container_name: jinbocho-catalog
    env_file:
      - ../envs/catalog-service.env   # copy from catalog-service.env.example and fill in values
    ports:
      # localhost-only: internal service, public access goes via the gateway (:8000)
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jinbocho-network

  api-gateway:
    build:
      context: ../../jinbocho-api-gateway-v1
    container_name: jinbocho-api-gateway
    env_file:
      - ../envs/api-gateway.env   # copy from api-gateway.env.example and fill in values
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - catalog-service
    networks:
      - jinbocho-network

  # Observability — replaces the Grafana Alloy/node-exporter/cadvisor/
  # postgres-exporter stack (ADR-012) with a single container. Host +
  # per-container metrics via /proc, /sys and the Docker socket; built-in
  # dashboard on :19999, bound to localhost only.
  # Off by default; enable with:
  #   docker compose -f docker-compose.community.local.yml --profile observability up -d
  netdata:
    image: netdata/netdata:stable
    container_name: jinbocho-netdata
    hostname: jinbocho-local
    pid: host
    profiles:
      - observability
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "127.0.0.1:19999:19999"
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jinbocho-network

networks:
  jinbocho-network:
    driver: bridge

volumes:
  postgres_data:
    name: jinbocho_local_postgres_data
  netdataconfig:
    name: jinbocho_local_netdataconfig
  netdatalib:
    name: jinbocho_local_netdatalib
  netdatacache:
    name: jinbocho_local_netdatacache
